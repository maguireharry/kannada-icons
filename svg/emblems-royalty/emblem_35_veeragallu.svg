<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<rect x="18" y="10" width="28" height="46" rx="3" fill="rgba(71,85,105,0.2)" stroke="#1E293B" stroke-width="2.5"/>
        <!-- Tier dividers -->
        <line x1="18" y1="24" x2="46" y2="24" stroke="#1E293B" stroke-width="2"/>
        <line x1="18" y1="38" x2="46" y2="38" stroke="#1E293B" stroke-width="2"/>
        <!-- Hero fighting in lower tier -->
        <circle cx="28" cy="44" r="2" fill="#C8102E"/>
        <line x1="28" y1="46" x2="28" y2="52" stroke="#C8102E" stroke-width="1.5"/>
        <line x1="28" y1="48" x2="36" y2="46" stroke="#C8102E" stroke-width="1.5"/>
        <!-- Hero reaching heaven in top tier -->
        <circle cx="32" cy="16" r="2" fill="#D4AF37"/>
        <line x1="30" y1="18" x2="34" y2="18" stroke="#D4AF37" stroke-width="1.5"/>
</svg>
