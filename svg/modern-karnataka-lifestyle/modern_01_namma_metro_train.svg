<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Aerodynamic silver metro train front with purple / green stripe -->
    <path d="M 18 16 C 18 10 46 10 46 16 L 44 46 C 44 50 20 50 20 46 Z" fill="#94A3B8" stroke="#0F172A" stroke-width="2"/>
    <!-- Windshield -->
    <path d="M 22 16 L 42 16 L 40 28 L 24 28 Z" fill="#0F172A"/>
    <!-- Purple Line / Green Line stripe -->
    <rect x="20" y="32" width="24" height="4" fill="#6B21A8"/>
    <!-- Twin headlights -->
    <circle cx="25" cy="40" r="2.5" fill="#FFD100"/>
    <circle cx="39" cy="40" r="2.5" fill="#FFD100"/>
    <!-- Elevated track line -->
    <line x1="10" y1="52" x2="54" y2="52" stroke="#1E293B" stroke-width="3"/>
</svg>
