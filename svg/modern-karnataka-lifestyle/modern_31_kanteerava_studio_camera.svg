<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Studio movie camera with film magazines -->
        <rect x="16" y="24" width="22" height="18" rx="3" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
        <!-- Double round film reels on top -->
        <circle cx="22" cy="18" r="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="32" cy="18" r="6" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
        <!-- Lens cone projecting forward -->
        <polygon points="38,28 48,22 48,38 38,34" fill="#D4AF37" stroke="#0F172A" stroke-width="1.5"/>
        <line x1="27" y1="42" x2="20" y2="56" stroke="#0F172A" stroke-width="2.5"/>
        <line x1="27" y1="42" x2="34" y2="56" stroke="#0F172A" stroke-width="2.5"/>
</svg>
