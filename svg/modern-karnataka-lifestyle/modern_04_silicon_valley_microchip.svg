<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Square chip body -->
    <rect x="20" y="20" width="24" height="24" rx="3" fill="#0F172A" stroke="#D4AF37" stroke-width="2"/>
    <!-- Kannada 'ಕ' engraved in glowing center -->
    <circle cx="32" cy="32" r="6" fill="#D4AF37"/>
    <circle cx="32" cy="32" r="2" fill="#0F172A"/>
    <!-- Circuit pins radiating -->
    <line x1="26" y1="12" x2="26" y2="20" stroke="#D4AF37" stroke-width="2"/>
    <line x1="32" y1="12" x2="32" y2="20" stroke="#D4AF37" stroke-width="2"/>
    <line x1="38" y1="12" x2="38" y2="20" stroke="#D4AF37" stroke-width="2"/>
    <line x1="26" y1="44" x2="26" y2="52" stroke="#D4AF37" stroke-width="2"/>
    <line x1="32" y1="44" x2="32" y2="52" stroke="#D4AF37" stroke-width="2"/>
    <line x1="38" y1="44" x2="38" y2="52" stroke="#D4AF37" stroke-width="2"/>
    <line x1="12" y1="26" x2="20" y2="26" stroke="#D4AF37" stroke-width="2"/>
    <line x1="12" y1="32" x2="20" y2="32" stroke="#D4AF37" stroke-width="2"/>
    <line x1="12" y1="38" x2="20" y2="38" stroke="#D4AF37" stroke-width="2"/>
    <line x1="44" y1="26" x2="52" y2="26" stroke="#D4AF37" stroke-width="2"/>
    <line x1="44" y1="32" x2="52" y2="32" stroke="#D4AF37" stroke-width="2"/>
    <line x1="44" y1="38" x2="52" y2="38" stroke="#D4AF37" stroke-width="2"/>
</svg>
