<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Tiger face contour -->
    <circle cx="32" cy="32" r="18" fill="#EA580C" stroke="#0F172A" stroke-width="2"/>
    <!-- Ears -->
    <circle cx="18" cy="18" r="5" fill="#EA580C" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="46" cy="18" r="5" fill="#EA580C" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="2" fill="#0F172A"/>
    <circle cx="46" cy="18" r="2" fill="#0F172A"/>
    <!-- Eyes -->
    <ellipse cx="25" cy="30" rx="2.5" ry="2" fill="#FFD100"/>
    <ellipse cx="39" cy="30" rx="2.5" ry="2" fill="#FFD100"/>
    <!-- Tiger stripes -->
    <path d="M 32 16 L 32 24 M 22 20 L 26 24 M 42 20 L 38 24 M 18 32 L 23 32 M 46 32 L 41 32" stroke="#0F172A" stroke-width="2"/>
    <!-- White muzzle and nose -->
    <ellipse cx="32" cy="40" rx="6" ry="4" fill="#FFFFFF"/>
    <polygon points="30,37 34,37 32,40" fill="#C8102E"/>
</svg>
