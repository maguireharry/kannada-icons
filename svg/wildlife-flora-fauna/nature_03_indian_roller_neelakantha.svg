<!-- Vibrant blue and turquoise Indian Roller perched -->
    <path d="M 30 16 C 36 16 42 22 40 32 L 36 48 L 30 48 L 26 34 C 24 24 24 16 30 16 Z" fill="#0284C7" stroke="#1E293B" stroke-width="1.5"/>
