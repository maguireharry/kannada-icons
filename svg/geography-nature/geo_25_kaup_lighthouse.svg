<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Cylindrical tower with horizontal bands -->
        <polygon points="26,48 28,18 36,18 38,48" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
        <!-- Black stripes -->
        <rect x="27.5" y="24" width="9" height="6" fill="#0F172A"/>
        <rect x="26.5" y="36" width="11" height="6" fill="#0F172A"/>
        <!-- Lantern room and dome -->
        <rect x="28" y="14" width="8" height="4" fill="#FFD100" stroke="#0F172A" stroke-width="1.5"/>
        <path d="M 28 14 C 28 10 36 10 36 14" fill="#C8102E"/>
        <!-- Light beams -->
        <line x1="36" y1="16" x2="52" y2="10" stroke="#FFD100" stroke-width="2"/>
        <line x1="28" y1="16" x2="12" y2="10" stroke="#FFD100" stroke-width="2"/>
</svg>
