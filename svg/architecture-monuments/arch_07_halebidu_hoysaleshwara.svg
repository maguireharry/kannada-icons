<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<rect x="10" y="16" width="44" height="36" fill="rgba(100,116,139,0.15)" stroke="#1E293B" stroke-width="2"/>
    <!-- Tier lines -->
    <line x1="10" y1="28" x2="54" y2="28" stroke="#D4AF37" stroke-width="2"/>
    <line x1="10" y1="40" x2="54" y2="40" stroke="#D4AF37" stroke-width="2"/>
    <!-- Top tier: Swan/Hamsa motifs -->
    <circle cx="20" cy="22" r="3" fill="#FFD100"/>
    <circle cx="32" cy="22" r="3" fill="#FFD100"/>
    <circle cx="44" cy="22" r="3" fill="#FFD100"/>
    <!-- Middle tier: Lions -->
    <rect x="18" y="32" width="6" height="5" fill="#C8102E"/>
    <rect x="30" y="32" width="6" height="5" fill="#C8102E"/>
    <rect x="42" y="32" width="6" height="5" fill="#C8102E"/>
    <!-- Bottom tier: Elephants -->
    <ellipse cx="20" cy="46" rx="4" ry="3" fill="#1E293B"/>
    <ellipse cx="32" cy="46" rx="4" ry="3" fill="#1E293B"/>
    <ellipse cx="44" cy="46" rx="4" ry="3" fill="#1E293B"/>
</svg>
