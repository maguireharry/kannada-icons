    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Enormous Circular Hemisphere Dome -->
    <path d="M 12 36 C 12 14 52 14 52 36 Z" fill="rgba(148,163,184,0.2)" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Lotus petal rim at dome base -->
    <path d="M 10 36 C 14 34 18 36 22 36 C 26 34 30 36 34 36 C 38 34 42 36 46 36 C 50 34 54 36 54 36" stroke="#D4AF37" stroke-width="2" fill="none"/>
    <!-- Cubical Base -->
    <rect x="12" y="36" width="40" height="20" fill="#FEF9C3" stroke="#1E293B" stroke-width="2"/>
    <!-- Central Arch -->
    <path d="M 24 56 L 24 44 C 24 40 40 40 40 44 L 40 56 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Finial Crescent -->
    <circle cx="32" cy="12" r="2.5" fill="#D4AF37"/>
</svg>
