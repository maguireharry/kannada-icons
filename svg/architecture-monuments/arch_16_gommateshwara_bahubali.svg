    <path d="M 27 12 L 26 16 M 37 12 L 38 16" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Torso and arms down to knees -->
    <path d="M 28 17 L 26 38 L 26 44 M 36 17 L 38 38 L 38 44" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 28 24 L 28 42 L 30 56 M 36 24 L 36 42 L 34 56" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <!-- Creepers (Madhavi latha) twining on legs -->
