</defs>
<!-- Brass pitcher pot -->
        <ellipse cx="32" cy="44" rx="14" ry="10" fill="#D4AF37" stroke="#B8860B" stroke-width="2"/>
        <!-- Mango leaves radiating -->
        <polygon points="32,34 20,24 28,34" fill="#15803D"/>
        <polygon points="32,34 44,24 36,34" fill="#15803D"/>
        <polygon points="32,34 32,18 36,32" fill="#15803D"/>
        <!-- Brown husked coconut with holy tilaka -->
        <circle cx="32" cy="22" r="7" fill="#78350F" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="32" cy="22" r="2" fill="#C8102E"/>
