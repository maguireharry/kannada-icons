</defs>
<!-- Floral pyramid carried by priest -->
        <polygon points="32,8 18,36 46,36" fill="#D4AF37" stroke="#FFD100" stroke-width="2"/>
        <!-- Jasmine flower layers -->
        <line x1="22" y1="28" x2="42" y2="28" stroke="#FFFFFF" stroke-width="3"/>
        <line x1="26" y1="20" x2="38" y2="20" stroke="#FFFFFF" stroke-width="3"/>
        <!-- Face of bearer veiled in flowers -->
        <circle cx="32" cy="44" r="8" fill="#FEF9C3" stroke="#1E293B" stroke-width="1.5"/>
        <circle cx="32" cy="42" r="2" fill="#C8102E"/>
</svg>
