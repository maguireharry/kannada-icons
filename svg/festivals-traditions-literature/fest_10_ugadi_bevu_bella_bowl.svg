<!-- Traditional bowl -->
    <path d="M 14 30 C 14 48 50 48 50 30 Z" fill="#D4AF37" stroke="#B8860B" stroke-width="2"/>
    <ellipse cx="32" cy="30" rx="18" ry="6" fill="#B8860B"/>
    <!-- Sweet brown Jaggery cubes -->
    <rect x="22" y="24" width="6" height="6" fill="#78350F"/>
    <rect x="36" y="24" width="6" height="6" fill="#78350F"/>
    <!-- Bitter green Neem leaves -->
    <ellipse cx="30" cy="22" rx="4" ry="2" transform="rotate(-30 30 22)" fill="#15803D"/>
    <ellipse cx="34" cy="22" rx="4" ry="2" transform="rotate(30 34 22)" fill="#15803D"/>
