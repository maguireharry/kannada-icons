<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Royal Caparisoned Elephant profile -->
    <ellipse cx="28" cy="38" rx="16" ry="12" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <!-- Trunk up in salute -->
    <path d="M 12 36 Q 6 30 10 24" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 750kg Golden Howdah (Chinnada Ambari) on back -->
    <rect x="22" y="16" width="16" height="12" rx="2" fill="#D4AF37" stroke="#B8860B" stroke-width="2"/>
    <polygon points="30,10 24,16 36,16" fill="#C8102E" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="30" cy="8" r="2" fill="#FFD100"/>
    <!-- Legs -->
    <line x1="20" y1="48" x2="20" y2="56" stroke="#1E293B" stroke-width="3"/>
    <line x1="34" y1="48" x2="34" y2="56" stroke="#1E293B" stroke-width="3"/>
</svg>
