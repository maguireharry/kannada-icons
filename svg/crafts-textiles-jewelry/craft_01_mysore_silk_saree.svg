<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Folded rich silk saree with golden border -->
    <rect x="14" y="20" width="36" height="28" rx="3" fill="#6B21A8" stroke="#1E293B" stroke-width="2"/>
    <!-- Gold Zari Border Band -->
    <rect x="14" y="20" width="10" height="28" rx="2" fill="#D4AF37" stroke="#B8860B" stroke-width="1.5"/>
    <line x1="19" y1="20" x2="19" y2="48" stroke="#FFD100" stroke-width="1" stroke-dasharray="2 1"/>
    <!-- Fold creases -->
    <line x1="24" y1="32" x2="50" y2="32" stroke="#D4AF37" stroke-width="1.5"/>
    <line x1="24" y1="40" x2="50" y2="40" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="36" cy="26" r="1.5" fill="#D4AF37"/>
</svg>
