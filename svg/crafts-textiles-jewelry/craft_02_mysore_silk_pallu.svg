<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<rect x="12" y="14" width="40" height="36" fill="#C8102E" stroke="#B8860B" stroke-width="2"/>
    <!-- Rich Golden Zari bands -->
    <rect x="12" y="14" width="40" height="8" fill="#D4AF37"/>
    <rect x="12" y="42" width="40" height="8" fill="#D4AF37"/>
    <!-- Paisley / Mango motifs in pallu center -->
    <circle cx="22" cy="30" r="3" fill="#FFD100"/>
    <circle cx="32" cy="30" r="3" fill="#FFD100"/>
    <circle cx="42" cy="30" r="3" fill="#FFD100"/>
    <!-- Fringe / Tassels -->
    <line x1="16" y1="50" x2="16" y2="56" stroke="#D4AF37" stroke-width="2"/>
    <line x1="24" y1="50" x2="24" y2="56" stroke="#D4AF37" stroke-width="2"/>
    <line x1="32" y1="50" x2="32" y2="56" stroke="#D4AF37" stroke-width="2"/>
    <line x1="40" y1="50" x2="40" y2="56" stroke="#D4AF37" stroke-width="2"/>
    <line x1="48" y1="50" x2="48" y2="56" stroke="#D4AF37" stroke-width="2"/>
</svg>
