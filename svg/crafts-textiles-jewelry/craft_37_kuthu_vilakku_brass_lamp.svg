        <line x1="32" y1="54" x2="32" y2="24" stroke="#D4AF37" stroke-width="3"/>
        <circle cx="32" cy="38" r="3" fill="#B8860B"/>
        <!-- 5-wick oil dish -->
        <ellipse cx="32" cy="24" rx="12" ry="4" fill="#D4AF37" stroke="#B8860B" stroke-width="1.5"/>
        <!-- Swan / Hamsa finial with flame -->
