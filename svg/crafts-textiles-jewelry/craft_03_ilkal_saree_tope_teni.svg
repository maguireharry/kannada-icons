<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<rect x="12" y="16" width="40" height="34" fill="#C8102E" stroke="#1E293B" stroke-width="2"/>
    <!-- Tope Teni triangular temple motifs in white and red -->
    <polygon points="18,34 22,22 26,34" fill="#FFFFFF" stroke="#C8102E" stroke-width="1"/>
    <polygon points="26,34 30,22 34,34" fill="#FFFFFF" stroke="#C8102E" stroke-width="1"/>
    <polygon points="34,34 38,22 42,34" fill="#FFFFFF" stroke="#C8102E" stroke-width="1"/>
    <!-- Kasuti embroidery stripes on border -->
    <line x1="12" y1="42" x2="52" y2="42" stroke="#FFD100" stroke-width="2"/>
    <line x1="12" y1="46" x2="52" y2="46" stroke="#FFD100" stroke-width="2"/>
</svg>
