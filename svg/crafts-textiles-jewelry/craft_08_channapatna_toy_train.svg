<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Engine Body -->
    <rect x="14" y="24" width="24" height="18" rx="3" fill="#C8102E" stroke="#1E293B" stroke-width="2"/>
    <rect x="30" y="16" width="16" height="26" rx="3" fill="#FFD100" stroke="#1E293B" stroke-width="2"/>
    <!-- Chimney / Funnel -->
    <rect x="18" y="16" width="6" height="8" fill="#15803D" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Wheels -->
    <circle cx="20" cy="46" r="5" fill="#FFD100" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="32" cy="46" r="5" fill="#C8102E" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="44" cy="46" r="5" fill="#15803D" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Headlight -->
    <circle cx="12" cy="32" r="2" fill="#D4AF37"/>
</svg>
