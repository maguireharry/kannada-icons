    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Lathe turned top with bright circular colored bands -->
    <polygon points="32,54 18,24 46,24" fill="#FFD100" stroke="#B8860B" stroke-width="2"/>
    <!-- Color bands -->
    <path d="M 21 30 L 43 30" stroke="#C8102E" stroke-width="3"/>
    <path d="M 24 38 L 40 38" stroke="#15803D" stroke-width="3"/>
    <path d="M 28 46 L 36 46" stroke="#C8102E" stroke-width="2.5"/>
    <!-- Rounded crown & spindle -->
    <path d="M 18 24 C 18 16 46 16 46 24 Z" fill="#C8102E" stroke="#B8860B" stroke-width="2"/>
    <line x1="32" y1="16" x2="32" y2="8" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    <!-- Steel tip -->
    <circle cx="32" cy="56" r="2" fill="#94A3B8"/>
</svg>
