</defs>
<!-- Curved rocking runner -->
    <path d="M 10 50 Q 32 60 54 50" stroke="#C8102E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Horse Body -->
    <ellipse cx="32" cy="36" rx="14" ry="8" fill="#FFD100" stroke="#B8860B" stroke-width="2"/>
    <!-- Horse Head & Mane -->
    <path d="M 40 32 L 46 20 C 48 16 46 12 42 14 L 38 22 Z" fill="#C8102E" stroke="#B8860B" stroke-width="1.5"/>
    <circle cx="42" cy="18" r="1.5" fill="#FFFFFF"/>
    <!-- Rocking struts -->
