<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<rect x="12" y="50" width="40" height="6" rx="2" fill="#78350F" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Center spindle -->
    <line x1="32" y1="50" x2="32" y2="14" stroke="#78350F" stroke-width="3"/>
    <!-- Graduated color rings -->
    <ellipse cx="32" cy="46" rx="18" ry="4" fill="#C8102E" stroke="#0F172A" stroke-width="1"/>
    <ellipse cx="32" cy="38" rx="15" ry="3.5" fill="#EA580C" stroke="#0F172A" stroke-width="1"/>
    <ellipse cx="32" cy="30" rx="12" ry="3" fill="#FFD100" stroke="#0F172A" stroke-width="1"/>
    <ellipse cx="32" cy="22" rx="9" ry="2.5" fill="#15803D" stroke="#0F172A" stroke-width="1"/>
    <!-- Top ball topper -->
    <circle cx="32" cy="14" r="5" fill="#0284C7" stroke="#0F172A" stroke-width="1"/>
</svg>
