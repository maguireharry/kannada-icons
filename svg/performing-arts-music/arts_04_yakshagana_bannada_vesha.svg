    </linearGradient>

</defs>
<!-- Red and black fierce demon face with white chutti knobs -->
    <circle cx="32" cy="34" r="18" fill="#C8102E" stroke="#0F172A" stroke-width="2.5"/>
    <!-- White pith knobs (Chutti) on nose and forehead -->
    <circle cx="32" cy="30" r="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
    <circle cx="32" cy="22" r="2.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
    <circle cx="24" cy="38" r="2.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
    <circle cx="40" cy="38" r="2.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1"/>
    <!-- Fierce eyes and fangs -->
    <ellipse cx="24" cy="28" rx="3" ry="2" fill="#FFD100"/>
    <ellipse cx="40" cy="28" rx="3" ry="2" fill="#FFD100"/>
    <path d="M 24 44 L 27 40 L 37 40 L 40 44" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
