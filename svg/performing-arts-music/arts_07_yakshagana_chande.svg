<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
<defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

</defs>
<!-- Vertical high-pitch cylinder drum -->
    <rect x="22" y="16" width="20" height="34" fill="#78350F" stroke="#0F172A" stroke-width="2"/>
    <ellipse cx="32" cy="16" rx="10" ry="3" fill="#FEF9C3" stroke="#0F172A" stroke-width="1.5"/>
    <ellipse cx="32" cy="50" rx="10" ry="3" fill="#FEF9C3" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Tight zigzag cords -->
    <path d="M 22 16 L 32 33 L 22 50 M 42 16 L 32 33 L 42 50" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
    <!-- Drumsticks (Kolu) -->
    <line x1="12" y1="12" x2="26" y2="18" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="12" x2="38" y2="18" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
</svg>
